<!DOCTYPE html>
<html lang="ru" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Batch Studio Mobile — Пакетная загрузка</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }</style>
</head>
<body class="min-h-full flex flex-col justify-between p-4 bg-slate-950">

  <div class="space-y-4 pt-2">
    <div class="flex items-center justify-between border-b border-slate-800 pb-3">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 to-orange-600 flex items-center justify-center text-lg shadow-md">
          📚
        </div>
        <div>
          <h1 class="text-sm font-bold text-white leading-tight">Batch <span class="text-amber-400">Mobile Studio</span></h1>
          <p class="text-[11px] text-emerald-400 font-medium">🟢 Подключено к вашему Mac (8095)</p>
        </div>
      </div>
      <span id="mobileCountBadge" class="text-xs font-mono px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">0 фото</span>
    </div>

    <!-- КНОПКИ ВЫБОРА ПАЧКИ ФОТО -->
    <div class="grid grid-cols-2 gap-3">
      <label class="flex flex-col items-center justify-center p-3.5 bg-slate-900 border border-slate-800 rounded-2xl active:bg-slate-800 transition text-center cursor-pointer shadow-lg">
        <input type="file" multiple accept="image/*" class="hidden" onchange="handleMobileFiles(event)">
        <span class="text-2xl mb-1">📂</span>
        <span class="text-xs font-bold text-white">Выбрать пачку</span>
        <span class="text-[10px] text-slate-400">из галереи</span>
      </label>

      <label class="flex flex-col items-center justify-center p-3.5 bg-slate-900 border border-slate-800 rounded-2xl active:bg-slate-800 transition text-center cursor-pointer shadow-lg">
        <input type="file" capture="environment" accept="image/*" class="hidden" onchange="handleMobileFiles(event)">
        <span class="text-2xl mb-1">📷</span>
        <span class="text-xs font-bold text-white">Камера</span>
        <span class="text-[10px] text-slate-400">Снять сейчас</span>
      </label>
    </div>

    <!-- КНОПКА РАЗДЕЛЕНИЯ КНИГ В 1 КЛИК -->
    <div class="bg-gradient-to-r from-amber-950/40 via-slate-900 to-amber-950/40 p-2.5 rounded-2xl border border-amber-500/30 flex items-center justify-between gap-2 shadow-sm">
      <div class="flex items-center gap-2">
        <span class="text-xl">📖</span>
        <div class="leading-tight">
          <div class="text-xs font-bold text-white" id="currentBookLabel">Книга #1</div>
          <div class="text-[10px] text-amber-400/90 font-medium" id="currentBookCount">0 фото в текущей книге</div>
        </div>
      </div>
      <button type="button" onclick="nextMobileBook()" class="px-3 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 active:scale-95 text-slate-950 font-bold text-xs shadow-md transition flex items-center gap-1.5 shrink-0">
        <span>+ След. книга</span>
        <span id="nextBookNumBadge" class="px-1.5 py-0.2 rounded-full bg-slate-950 text-amber-300 text-[10px] font-mono">#2</span>
      </button>
    </div>

    <!-- ПРЕВЬЮ ВЫБРАННЫХ ФОТО -->
    <div class="space-y-2">
      <div class="flex items-center justify-between text-xs text-slate-400">
        <span>Кадры сессии:</span>
        <button type="button" onclick="clearMobilePhotos()" class="text-rose-400">Очистить всё</button>
      </div>

      <div id="mobileGrid" class="space-y-3 min-h-[120px]">
        <div class="text-center py-8 border border-dashed border-slate-800 rounded-2xl text-xs text-slate-500 bg-slate-900/40">
          Выберите пачку фотографий из галереи или снимите на камеру
        </div>
      </div>
    </div>
  </div>

  <div class="pt-4 pb-2">
    <button type="button" onclick="sendToMac()" id="sendBtn" class="w-full py-4 rounded-2xl bg-gradient-to-r from-amber-500 via-orange-500 to-amber-600 active:from-amber-600 text-white font-bold text-base shadow-xl shadow-amber-500/25 transition flex items-center justify-center gap-2">
      <span>🚀</span>
      <span id="sendBtnText">Отправить пачку в программу на Mac</span>
    </button>
    <p id="mobileStatus" class="text-center text-[11px] text-slate-500 mt-2">Кадры мгновенно попадут в сортировщик на Mac</p>
  </div>

  <script>
    let mobileImages = [];
    let currentMobileBookNum = 1;

    function nextMobileBook() {
      const photosInCur = mobileImages.filter(img => (img.book_index || 1) === currentMobileBookNum).length;
      if (photosInCur === 0) {
        alert('Сначала добавьте фото для текущей книги перед переходом к следующей!');
        return;
      }
      currentMobileBookNum++;
      if (navigator.vibrate) navigator.vibrate(40);
      updateMobileBookUI();
      renderMobileGrid();
    }

    function updateMobileBookUI() {
      const label = document.getElementById('currentBookLabel');
      const count = document.getElementById('currentBookCount');
      const nextBadge = document.getElementById('nextBookNumBadge');
      const inCur = mobileImages.filter(img => (img.book_index || 1) === currentMobileBookNum).length;
      if (label) label.textContent = `Книга #${currentMobileBookNum}`;
      if (count) count.textContent = `${inCur} фото в текущей книге`;
      if (nextBadge) nextBadge.textContent = `#${currentMobileBookNum + 1}`;
    }

    function resizeImage(file, maxDimension = 1800, quality = 0.85) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;
            if (width > maxDimension || height > maxDimension) {
              if (width > height) {
                height = Math.round((height * maxDimension) / width);
                width = maxDimension;
              } else {
                width = Math.round((width * maxDimension) / height);
                height = maxDimension;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            resolve({
              name: file.name || 'batch_photo.jpg',
              mime: 'image/jpeg',
              data: dataUrl.split(',')[1],
              preview: dataUrl,
              book_index: currentMobileBookNum
            });
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function handleMobileFiles(e) {
      const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
      if (files.length === 0) return;
      const status = document.getElementById('mobileStatus');
      status.textContent = '⚡ Быстрая оптимизация ' + files.length + ' фото...';

      // Параллельная оптимизация порциями по 4 файла для моментальной отдачи
      const batchSize = 4;
      for (let i = 0; i < files.length; i += batchSize) {
        const slice = files.slice(i, i + batchSize);
        const resizedSlice = await Promise.all(slice.map(f => resizeImage(f, 1600, 0.84)));
        mobileImages.push(...resizedSlice);
        updateMobileBookUI();
        renderMobileGrid();
        status.textContent = `⚡ Оптимизировано ${mobileImages.length} из ${files.length} фото...`;
      }
      status.textContent = `✅ ${mobileImages.length} фото готовы к отправке на Mac`;
      e.target.value = '';
    }

    function renderMobileGrid() {
      const grid = document.getElementById('mobileGrid');
      const badge = document.getElementById('mobileCountBadge');
      badge.textContent = `${mobileImages.length} фото`;

      if (mobileImages.length === 0) {
        grid.innerHTML = '<div class="text-center py-8 border border-dashed border-slate-800 rounded-2xl text-xs text-slate-500 bg-slate-900/40">Выберите пачку фотографий из галереи или снимите на камеру</div>';
        return;
      }

      // Группируем фото по book_index
      const bookGroups = {};
      mobileImages.forEach((img, idx) => {
        const bNum = img.book_index || 1;
        if (!bookGroups[bNum]) bookGroups[bNum] = [];
        bookGroups[bNum].push({ img, idx });
      });

      const groupKeys = Object.keys(bookGroups).map(Number).sort((a, b) => a - b);

      grid.innerHTML = groupKeys.map(bNum => {
        const items = bookGroups[bNum];
        return `
          <div class="space-y-2 bg-slate-900/70 p-2.5 rounded-2xl border border-slate-800 shadow-sm">
            <div class="flex items-center justify-between px-1">
              <span class="text-xs font-bold text-amber-400 flex items-center gap-1.5">
                <span>📖</span> <span>Книга #${bNum}</span>
              </span>
              <span class="text-[10px] text-slate-400 font-mono">${items.length} фото</span>
            </div>
            <div class="grid grid-cols-3 gap-2">
              ${items.map(({ img, idx }) => `
                <div class="relative group bg-slate-950 rounded-xl overflow-hidden border border-slate-800 aspect-[3/4]">
                  <img src="${img.preview}" class="w-full h-full object-cover">
                  <div class="absolute top-1 left-1 px-1.5 py-0.5 rounded bg-black/80 text-[10px] font-semibold text-white">
                    #${idx+1}
                  </div>
                  <button type="button" onclick="removeMobileImage(${idx})" class="absolute top-1 right-1 w-6 h-6 rounded-full bg-black/80 text-white flex items-center justify-center text-xs">✕</button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function removeMobileImage(idx) {
      mobileImages.splice(idx, 1);
      updateMobileBookUI();
      renderMobileGrid();
    }

    function clearMobilePhotos() {
      mobileImages = [];
      currentMobileBookNum = 1;
      updateMobileBookUI();
      renderMobileGrid();
    }

    async function sendToMac() {
      if (mobileImages.length === 0) {
        alert('Пожалуйста, выберите фотографии!');
        return;
      }

      const btn = document.getElementById('sendBtn');
      const btnText = document.getElementById('sendBtnText');
      const status = document.getElementById('mobileStatus');

      btn.disabled = true;
      btnText.textContent = 'Передача пачки на Mac...';
      status.textContent = `Отправка ${mobileImages.length} фотографий...`;

      try {
        const res = await fetch('/api/mobile_upload', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            images: mobileImages.map(img => ({
              name: img.name,
              mime: img.mime,
              data: img.data,
              book_index: img.book_index || 1
            }))
          })
        });

        const data = await res.json();
        if (data.success) {
          status.textContent = '✅ Пачка успешно передана в программу на Mac!';
          status.className = 'text-center text-xs text-emerald-400 font-semibold mt-2';
          mobileImages = [];
          currentMobileBookNum = 1;
          updateMobileBookUI();
          renderMobileGrid();
          alert('✅ Успешно отправлено! Все фото уже в пуле на экране компьютера.');
        } else {
          throw new Error(data.error || 'Ошибка передачи');
        }
      } catch (err) {
        alert('Ошибка: ' + err.message);
        status.textContent = 'Ошибка отправки';
        status.className = 'text-center text-xs text-rose-400 mt-2';
      } finally {
        btn.disabled = false;
        btnText.textContent = 'Отправить пачку в программу на Mac';
      }
    }
  </script>
</body>
</html>
